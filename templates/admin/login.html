<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід адміністратора</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-bg admin-login-page">
<div class="login-overlay" id="login-overlay" aria-label="Фон вікна входу">
<div class="login-box login-dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <a class="login-close" href="{{ url_for('localized_index', lang='uk') }}" aria-label="Закрити вікно входу" title="Закрити">&times;</a>
    <h1 id="login-title">Вхід адміністратора</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <p class="error">{{ messages[0] }}</p>
        {% endif %}
    {% endwith %}
    <form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <label>Логін</label>
        <input type="text" name="username" required>
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button type="submit">Увійти</button>
    </form>
</div>
</div>
<script>
(() => {
    const homeUrl = {{ url_for('localized_index', lang='uk') | tojson }};
    const overlay = document.getElementById('login-overlay');
    overlay.addEventListener('click', event => {
        if (event.target === overlay) window.location.assign(homeUrl);
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') window.location.assign(homeUrl);
    });
})();
</script>
</body>
</html>
