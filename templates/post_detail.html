{% extends "base.html" %}
{% block title %}{{ localized(post, 'title') }}{% endblock %}
{% block content %}
<style>.post-photo-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0 28px}.post-photo-gallery a{display:block}.post-photo-gallery img{width:100%;height:240px;object-fit:cover;border-radius:12px}</style>
<section class="page-hero compact">
    <div class="container">
        <span class="eyebrow">{{ post.category_name or tr('news') }}</span>
        <h1>{{ localized(post, 'title') }}</h1>
        <p>{{ post.created_at }}</p>
    </div>
</section>

<section class="container article">
    {% if post.image %}
    <img class="article-img" src="{{ url_for('static', filename='uploads/' ~ post.image) }}" alt="">
    {% endif %}
    <p>{{ localized(post, 'content') }}</p>
</section>
{% endblock %}
